<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIRE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>

:root {
  --black: #17120f;
  --paper: #f8f3e9;
  --red: #ef260f;
  --orange: #ff7b00;
  --yellow: #ffc400;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;

  background:
    radial-gradient(circle at 10% 10%, #ff9d0030, transparent 25rem),
    radial-gradient(circle at 90% 50%, #ff3c0030, transparent 25rem),
    var(--paper);

  font-family: "Patrick Hand", cursive;
  color: var(--black);
}

#loginScreen {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  justify-content: center;
  align-items: center;

  background: var(--paper);
}

.loginBox {
  text-align: center;
  padding: 45px;
  width: min(430px, 90vw);

  border: 4px solid var(--black);
  border-radius: 35px 50px 40px 45px;

  background: white;

  box-shadow: 10px 12px 0 #00000025;
}

.loginLogo {
  font-family: "Permanent Marker", cursive;
  font-size: 5rem;

  color: var(--orange);

  -webkit-text-stroke: 3px var(--black);
}

.loginBox button {
  margin-top: 20px;

  border: 3px solid var(--black);

  padding: 14px 25px;

  border-radius: 20px;

  background: white;

  font-family: "Patrick Hand", cursive;
  font-size: 1.4rem;

  cursor: pointer;

  box-shadow: 4px 5px 0 var(--black);
}

.app {
  width: min(1100px, 94vw);

  margin: auto;

  padding-top: 50px;

  padding-bottom: 180px;
}

.account {
  position: fixed;

  top: 20px;
  right: 20px;

  z-index: 50;

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 8px 12px;

  background: white;

  border: 3px solid var(--black);

  border-radius: 25px;

  box-shadow: 4px 5px 0 #00000020;
}

.account img {
  width: 45px;
  height: 45px;

  border-radius: 50%;

  border: 3px solid var(--black);
}

.accountInfo {
  display: flex;
  flex-direction: column;
}

#userEmail {
  font-size: 1rem;
}

#signOutBtn {
  border: none;

  background: transparent;

  font-family: "Patrick Hand", cursive;

  cursor: pointer;

  text-decoration: underline;
}

.hero {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 50px;
}

.logo {
  display: flex;

  font-family: "Permanent Marker", cursive;

  font-size: clamp(4rem, 12vw, 9rem);

  margin: 0;
}

.logo span {
  -webkit-text-stroke: 4px var(--black);

  paint-order: stroke fill;

  text-shadow: 4px 5px 0 #00000020;
}

.logo span:nth-child(1),
.logo span:nth-child(3) {
  color: var(--red);
}

.logo span:nth-child(2) {
  color: var(--orange);
}

.logo span:nth-child(4) {
  color: var(--yellow);
}

.bigFlame {
  font-size: 5rem;

  animation: flicker 1.5s infinite alternate;
}

.searchBox {
  width: min(760px, 100%);

  margin: 20px auto 40px;

  display: flex;

  align-items: center;

  padding: 10px 15px;

  border: 4px solid var(--black);

  border-radius: 999px;

  background: white;

  box-shadow: 6px 7px 0 #00000015;
}

.searchIcon {
  font-size: 2rem;

  margin-right: 10px;
}

.searchBox input {
  flex: 1;

  border: none;

  outline: none;

  font-family: "Patrick Hand", cursive;

  font-size: 1.8rem;

  min-width: 0;
}

.searchBox button {
  border: 3px solid var(--black);

  background: var(--yellow);

  padding: 10px 20px;

  border-radius: 15px;

  font-family: "Patrick Hand", cursive;

  font-size: 1.2rem;

  cursor: pointer;
}

.links {
  display: flex;

  justify-content: center;

  gap: 40px;

  flex-wrap: wrap;
}

.card {
  width: 160px;
  height: 145px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  gap: 10px;

  border: 4px solid var(--black);

  border-radius: 45% 55% 48% 52%;

  background: white;

  text-decoration: none;

  color: var(--black);

  font-size: 1.7rem;

  font-family: "Patrick Hand", cursive;

  cursor: pointer;

  transition: 0.2s;
}

.card:hover {
  transform: translateY(-8px) rotate(-2deg);
}

.cardIcon {
  font-size: 3rem;
}

#favoritesPanel {
  display: none;

  width: min(600px, 90vw);

  margin: 30px auto;

  padding: 20px;

  background: white;

  border: 4px solid var(--black);

  border-radius: 30px;
}

.favoriteForm {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;
}

.favoriteForm input {
  flex: 1;

  min-width: 150px;

  padding: 10px;

  font-family: "Patrick Hand", cursive;

  font-size: 1.1rem;

  border: 3px solid var(--black);

  border-radius: 12px;
}

.favoriteForm button {
  padding: 10px 18px;

  border: 3px solid var(--black);

  background: var(--yellow);

  border-radius: 12px;

  font-family: "Patrick Hand", cursive;

  cursor: pointer;
}

.favoriteItem {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 10px;

  padding: 10px;

  border: 3px solid var(--black);

  border-radius: 15px;
}

.favoriteItem a {
  color: var(--black);

  font-size: 1.2rem;
}

.favoriteItem button {
  background: var(--red);

  color: white;

  border: 2px solid var(--black);

  border-radius: 8px;

  cursor: pointer;
}

.player {
  width: min(700px, 95vw);

  margin: 60px auto 0;

  padding: 20px;

  display: grid;

  grid-template-columns: 150px 1fr;

  gap: 20px;

  background: white;

  border: 4px solid var(--black);

  border-radius: 30px 45px 35px 50px;
}

.albumArt {
  height: 150px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 5rem;

  background:
    linear-gradient(
      135deg,
      var(--yellow),
      var(--orange),
      var(--red)
    );

  border: 4px solid var(--black);

  border-radius: 20px;
}

.player h2 {
  margin-bottom: 5px;

  font-family: "Permanent Marker", cursive;
}

.player input[type=file] {
  width: 100%;
}

.controls {
  grid-column: 1 / -1;

  display: flex;

  align-items: center;

  gap: 10px;
}

#playButton {
  width: 55px;
  height: 55px;

  border-radius: 50%;

  border: 4px solid var(--black);

  background: var(--red);

  color: white;

  font-size: 1.3rem;

  cursor: pointer;
}

#progress {
  flex: 1;
}

.fire {
  position: fixed;

  bottom: 0;
  left: 0;

  width: 100%;

  height: 160px;

  pointer-events: none;

  z-index: -1;

  overflow: hidden;
}

.fireBlob {
  position: absolute;

  width: 120%;

  height: 180px;

  left: -10%;

  bottom: -40px;

  background:
    radial-gradient(ellipse at 5% 70%, yellow 0 12%, transparent 13%),
    radial-gradient(ellipse at 15% 35%, red 0 12%, transparent 13%),
    radial-gradient(ellipse at 25% 65%, orange 0 14%, transparent 15%),
    radial-gradient(ellipse at 38% 30%, red 0 13%, transparent 14%),
    radial-gradient(ellipse at 50% 65%, yellow 0 14%, transparent 15%),
    radial-gradient(ellipse at 63% 35%, red 0 13%, transparent 14%),
    radial-gradient(ellipse at 75% 60%, orange 0 14%, transparent 15%),
    radial-gradient(ellipse at 90% 30%, red 0 12%, transparent 13%);

  animation: fireMove 4s infinite alternate ease-in-out;
}

@keyframes flicker {
  from {
    transform: scale(1) rotate(-3deg);
  }

  to {
    transform: scale(1.1, .95) rotate(3deg);
  }
}

@keyframes fireMove {
  from {
    transform: translateX(-20px) scaleY(.9);
  }

  to {
    transform: translateX(20px) scaleY(1.1);
  }
}

@media(max-width:600px) {

  .hero {
    gap: 10px;
  }

  .bigFlame {
    font-size: 3rem;
  }

  .account {
    top: 8px;
    right: 8px;
  }

  .accountInfo {
    display: none;
  }

  .player {
    grid-template-columns: 1fr;
  }

  .albumArt {
    width: 150px;

    margin: auto;
  }

}

</style>
</head>

<body>

<!-- LOGIN SCREEN -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="loginLogo">🔥 FIRE 🔥</div>

    <h2>Enter the FIRE</h2>

    <p>Sign in with your Google account.</p>

    <button id="googleLogin">
      Continue with Google
    </button>

  </div>

</div>


<!-- USER ACCOUNT -->

<div class="account" id="accountBox" style="display:none">

  <img id="userPhoto" alt="Profile picture">

  <div class="accountInfo">

    <span id="userEmail"></span>

    <button id="signOutBtn">
      Sign out
    </button>

  </div>

</div>


<!-- WEBSITE -->

<div class="app">

  <div class="hero">

    <div class="bigFlame">🔥</div>

    <h1 class="logo">

      <span>F</span>
      <span>I</span>
      <span>R</span>
      <span>E</span>

    </h1>

    <div class="bigFlame">🔥</div>

  </div>


  <!-- SEARCH -->

  <form class="searchBox" id="searchForm">

    <div class="searchIcon">⌕</div>

    <input
      id="searchInput"
      placeholder="Search"
    >

    <button>
      Search
    </button>

  </form>


  <!-- BUTTONS -->

  <div class="links">

    <a
      class="card"
      href="https://www.youtube.com"
      target="_blank"
    >

      <div class="cardIcon">▶️</div>

      Videos

    </a>


    <a
      class="card"
      href="https://www.crazygames.com"
      target="_blank"
    >

      <div class="cardIcon">🎮</div>

      Games

    </a>


    <button
      class="card"
      id="favoritesButton"
    >

      <div class="cardIcon">❤️</div>

      Favorites

    </button>

  </div>


  <!-- FAVORITES -->

  <div id="favoritesPanel">

    <h2>❤️ My Favorites</h2>

    <form
      class="favoriteForm"
      id="favoriteForm"
    >

      <input
        id="favoriteName"
        placeholder="Website name"
        required
      >

      <input
        id="favoriteURL"
        placeholder="https://example.com"
        required
      >

      <button>
        Add
      </button>

    </form>

    <div id="favoriteList"></div>

  </div>


  <!-- MUSIC PLAYER -->

  <div class="player">

    <div class="albumArt">
      🔥
    </div>

    <div>

      <p>NOW PLAYING</p>

      <h2 id="songName">
        No song selected
      </h2>

      <input
        type="file"
        id="songPicker"
        accept="audio/*"
      >

    </div>


    <div class="controls">

      <button id="playButton">
        ▶
      </button>

      <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
      >

      <span id="time">
        0:00
      </span>

    </div>

    <audio id="audio"></audio>

  </div>

</div>


<!-- FIRE -->

<div class="fire">
  <div class="fireBlob"></div>
</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {

  getAuth,

  GoogleAuthProvider,

  signInWithRedirect,

  getRedirectResult,

  onAuthStateChanged,

  signOut

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =================================

   PUT YOUR FIREBASE CONFIG HERE

================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCo-dW-7JPzYtySL7MMR8cnwYb2TJU4tTo",
  authDomain: "fire-cc972.firebaseapp.com",
  projectId: "fire-cc972",
  storageBucket: "fire-cc972.firebasestorage.app",
  messagingSenderId: "69937265309",
  appId: "1:69937265309:web:48e8e35eb42b1963dd3274",
  measurementId: "G-649ZY591NR"
};


/* ================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


const loginScreen =
document.getElementById("loginScreen");

const accountBox =
document.getElementById("accountBox");

const googleLogin =
document.getElementById("googleLogin");

const userEmail =
document.getElementById("userEmail");

const userPhoto =
document.getElementById("userPhoto");


googleLogin.addEventListener("click", () => {

  signInWithRedirect(auth, provider);

});


getRedirectResult(auth)
.catch((error) => {

  console.log(error);

});


onAuthStateChanged(auth, (user) => {

  if (user) {

    loginScreen.style.display = "none";

    accountBox.style.display = "flex";

    userEmail.textContent =
    user.email || "No email";

    userPhoto.src =
    user.photoURL ||
    "https://via.placeholder.com/100";

  }

  else {

    loginScreen.style.display = "flex";

    accountBox.style.display = "none";

  }

});


document
.getElementById("signOutBtn")
.addEventListener("click", () => {

  signOut(auth);

});

</script>


<!-- NORMAL WEBSITE JAVASCRIPT -->

<script>

/* SEARCH */

document
.getElementById("searchForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const query =
  document
  .getElementById("searchInput")
  .value
  .trim();

  if(query) {

    window.open(
      "https://www.google.com/search?q="
      + encodeURIComponent(query),
      "_blank"
    );

  }

});


/* FAVORITES */

const favoritesButton =
document.getElementById("favoritesButton");

const favoritesPanel =
document.getElementById("favoritesPanel");


favoritesButton.addEventListener("click", () => {

  favoritesPanel.style.display =
  favoritesPanel.style.display === "block"
  ? "none"
  : "block";

  renderFavorites();

});


function getFavorites() {

  return JSON.parse(
    localStorage.getItem("fireFavorites")
  ) || [];

}


function saveFavorites(items) {

  localStorage.setItem(
    "fireFavorites",
    JSON.stringify(items)
  );

}


document
.getElementById("favoriteForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const name =
  document
  .getElementById("favoriteName")
  .value;

  let url =
  document
  .getElementById("favoriteURL")
  .value;


  if(
    !url.startsWith("http://")
    &&
    !url.startsWith("https://")
  ) {

    url =
    "https://" + url;

  }


  const favorites =
  getFavorites();


  favorites.push({
    name: name,
    url: url
  });


  saveFavorites(favorites);


  this.reset();


  renderFavorites();

});


function renderFavorites() {

  const list =
  document
  .getElementById("favoriteList");


  const favorites =
  getFavorites();


  list.innerHTML = "";


  favorites.forEach((favorite, index) => {

    const item =
    document.createElement("div");


    item.className =
    "favoriteItem";


    item.innerHTML = `

      <a
        href="${favorite.url}"
        target="_blank"
      >

        ${favorite.name}

      </a>

      <button>

        Delete

      </button>

    `;


    item
    .querySelector("button")
    .addEventListener("click", () => {

      const favorites =
      getFavorites();


      favorites.splice(
        index,
        1
      );


      saveFavorites(
        favorites
      );


      renderFavorites();

    });


    list.appendChild(item);

  });

}


/* MUSIC PLAYER */

const audio =
document.getElementById("audio");

const songPicker =
document.getElementById("songPicker");

const playButton =
document.getElementById("playButton");

const progress =
document.getElementById("progress");

const songName =
document.getElementById("songName");

const time =
document.getElementById("time");


songPicker.addEventListener("change", () => {

  const file =
  songPicker.files[0];


  if(!file) return;


  audio.src =
  URL.createObjectURL(file);


  songName.textContent =
  file.name;


});


playButton.addEventListener("click", () => {

  if(!audio.src) {

    songPicker.click();

    return;

  }


  if(audio.paused) {

    audio.play();

  }

  else {

    audio.pause();

  }

});


audio.addEventListener("play", () => {

  playButton.textContent =
  "Ⅱ";

});


audio.addEventListener("pause", () => {

  playButton.textContent =
  "▶";

});


audio.addEventListener("timeupdate", () => {

  if(!audio.duration) return;


  progress.value =
  audio.currentTime
  /
  audio.duration
  *
  100;


  time.textContent =
  formatTime(audio.currentTime)
  +
  " / "
  +
  formatTime(audio.duration);

});


progress.addEventListener("input", () => {

  if(audio.duration) {

    audio.currentTime =
    progress.value
    /
    100
    *
    audio.duration;

  }

});


function formatTime(seconds) {

  const minutes =
  Math.floor(seconds / 60);


  const secs =
  Math.floor(seconds % 60)
  .toString()
  .padStart(2, "0");


  return
  minutes
  +
  ":"
  +
  secs;

}

</script>

</body>
</html>
